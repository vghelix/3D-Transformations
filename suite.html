<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Transform Suite - Professional 3D Object Manipulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0f0f1e;
            --secondary: #1a1a2e;
            --tertiary: #16213e;
            --accent-cyan: #00d9ff;
            --accent-purple: #a855f7;
            --accent-lime: #84cc16;
            --text-light: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --shadow: rgba(0, 0, 0, 0.5);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, var(--tertiary) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-light);
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: linear-gradient(to bottom, rgba(15, 15, 30, 0.95), rgba(15, 15, 30, 0.7));
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
        }

        .reset-btn {
            padding: 8px 20px;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
            color: var(--primary);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.4);
        }

        .sidebar-left {
            position: absolute;
            left: 0;
            top: 70px;
            width: 280px;
            height: calc(100% - 70px);
            background: linear-gradient(180deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.95) 100%);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 30px 20px;
            backdrop-filter: blur(10px);
            z-index: 50;
        }

        .sidebar-left::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-left::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar-left::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 3px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-cyan);
            margin-bottom: 15px;
            margin-top: 20px;
        }

        .section-title:first-child {
            margin-top: 0;
        }

        .object-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .object-btn {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            border-radius: 8px;
            color: var(--text-light);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .object-btn:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .object-btn.active {
            background: linear-gradient(135deg, rgba(0, 217, 255, 0.2) 0%, rgba(168, 85, 247, 0.2) 100%);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.3);
        }

        .sidebar-right {
            position: absolute;
            right: 0;
            top: 70px;
            width: 320px;
            height: calc(100% - 70px);
            background: linear-gradient(180deg, rgba(26, 26, 46, 0.95) 0%, rgba(22, 33, 62, 0.95) 100%);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: 30px 20px;
            backdrop-filter: blur(10px);
            z-index: 50;
        }

        .sidebar-right::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-right::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .sidebar-right::-webkit-scrollbar-thumb {
            background: var(--accent-purple);
            border-radius: 3px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: block;
        }

        .slider-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-purple));
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
            border: 2px solid var(--primary);
            transition: all 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            width: 18px;
            height: 18px;
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.7);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
            border: 2px solid var(--primary);
        }

        .value-display {
            min-width: 50px;
            padding: 4px 8px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            border-radius: 4px;
            font-size: 11px;
            color: var(--accent-cyan);
            text-align: center;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .mini-btn {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-light);
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .mini-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }

        .info-box {
            background: rgba(0, 217, 255, 0.08);
            border: 1px solid var(--accent-cyan);
            border-radius: 8px;
            padding: 15px;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-top: 20px;
        }

        .info-box strong {
            color: var(--accent-cyan);
        }

        .canvas-wrapper {
            flex: 1;
            margin-left: 280px;
            margin-right: 320px;
            margin-top: 70px;
            position: relative;
            background: radial-gradient(circle at center, rgba(0, 217, 255, 0.05) 0%, transparent 70%);
        }

        @media (max-width: 768px) {
            .sidebar-left, .sidebar-right {
                width: 100%;
                height: auto;
                max-height: 40vh;
                position: static;
                border: none;
                margin-top: 10px;
            }

            .canvas-wrapper {
                margin: 70px 0 0 0;
            }

            .container {
                flex-direction: column;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sidebar-left, .sidebar-right, .header {
            animation: fadeIn 0.5s ease;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="header">
        <div class="title">3D Transform Suite</div>
        <button class="reset-btn" id="resetBtn">Reset All</button>
    </div>

    <div class="sidebar-left">
        <div class="section-title">Select Object</div>
        <div class="object-grid">
            <button class="object-btn active" data-object="cube">Cube</button>
            <button class="object-btn" data-object="sphere">Sphere</button>
            <button class="object-btn" data-object="torus">Torus</button>
            <button class="object-btn" data-object="tetrahedron">Tetrahedron</button>
            <button class="object-btn" data-object="octahedron">Octahedron</button>
            <button class="object-btn" data-object="cone">Cone</button>
            <button class="object-btn" data-object="cylinder">Cylinder</button>
            <button class="object-btn" data-object="pyramid">Pyramid</button>
        </div>

        <div class="section-title">Object Info</div>
        <div class="info-box">
            <strong>Current:</strong> <span id="objectName">Cube</span><br>
            <strong>Vertices:</strong> <span id="vertexCount">24</span><br>
            <strong>Faces:</strong> <span id="faceCount">6</span>
        </div>
    </div>

    <div class="sidebar-right">
        <div class="section-title">Rotation (Degrees)</div>
        <div class="control-group">
            <label class="control-label">X Axis</label>
            <div class="slider-container">
                <input type="range" id="rotX" min="-360" max="360" value="0">
                <div class="value-display" id="rotXValue">0</div>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">Y Axis</label>
            <div class="slider-container">
                <input type="range" id="rotY" min="-360" max="360" value="0">
                <div class="value-display" id="rotYValue">0</div>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">Z Axis</label>
            <div class="slider-container">
                <input type="range" id="rotZ" min="-360" max="360" value="0">
                <div class="value-display" id="rotZValue">0</div>
            </div>
        </div>

        <div class="section-title">Scale</div>
        <div class="control-group">
            <label class="control-label">Uniform Scale</label>
            <div class="slider-container">
                <input type="range" id="scaleUniform" min="0.1" max="3" step="0.1" value="1">
                <div class="value-display" id="scaleUniformValue">1.0</div>
            </div>
        </div>

        <div class="section-title">Shear</div>
        <div class="control-group">
            <label class="control-label">Shear XY</label>
            <div class="slider-container">
                <input type="range" id="shearXY" min="-1" max="1" step="0.1" value="0">
                <div class="value-display" id="shearXYValue">0.0</div>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">Shear XZ</label>
            <div class="slider-container">
                <input type="range" id="shearXZ" min="-1" max="1" step="0.1" value="0">
                <div class="value-display" id="shearXZValue">0.0</div>
            </div>
        </div>

        <div class="section-title">Translation</div>
        <div class="control-group">
            <label class="control-label">Position X</label>
            <div class="slider-container">
                <input type="range" id="transX" min="-5" max="5" step="0.1" value="0">
                <div class="value-display" id="transXValue">0.0</div>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">Position Y</label>
            <div class="slider-container">
                <input type="range" id="transY" min="-5" max="5" step="0.1" value="0">
                <div class="value-display" id="transYValue">0.0</div>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">Position Z</label>
            <div class="slider-container">
                <input type="range" id="transZ" min="-5" max="5" step="0.1" value="0">
                <div class="value-display" id="transZValue">0.0</div>
            </div>
        </div>

        <div class="section-title">Appearance</div>
        <div class="control-group">
            <label class="control-label">Metalness</label>
            <div class="slider-container">
                <input type="range" id="metalness" min="0" max="1" step="0.1" value="0.5">
                <div class="value-display" id="metalnessValue">0.5</div>
            </div>
        </div>
        <div class="control-group">
            <label class="control-label">Roughness</label>
            <div class="slider-container">
                <input type="range" id="roughness" min="0" max="1" step="0.1" value="0.5">
                <div class="value-display" id="roughnessValue">0.5</div>
            </div>
        </div>

        <div class="info-box">
            <strong>Tip:</strong> Drag canvas to rotate. Scroll to zoom.
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const canvas = document.getElementById('canvas');
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x0f0f1e, 0);
        renderer.shadowMap.enabled = true;

        camera.position.z = 5;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0x00d9ff, 1);
        directionalLight.position.set(5, 5, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0xa855f7, 0.8);
        pointLight.position.set(-5, -5, 5);
        scene.add(pointLight);

        let currentObject = null;
        let currentObjectType = 'cube';

        function createGeometry(type) {
            switch(type) {
                case 'cube':
                    return new THREE.BoxGeometry(2, 2, 2, 8, 8, 8);
                case 'sphere':
                    return new THREE.SphereGeometry(1, 32, 32);
                case 'torus':
                    return new THREE.TorusGeometry(1, 0.4, 16, 100);
                case 'tetrahedron':
                    return new THREE.TetrahedronGeometry(1.5, 0);
                case 'octahedron':
                    return new THREE.OctahedronGeometry(1.5, 0);
                case 'cone':
                    return new THREE.ConeGeometry(1, 2.5, 32);
                case 'cylinder':
                    return new THREE.CylinderGeometry(1, 1, 2.5, 32);
                case 'pyramid':
                    return new THREE.ConeGeometry(1, 2.5, 4);
                default:
                    return new THREE.BoxGeometry(2, 2, 2, 8, 8, 8);
            }
        }

        function createObject(type) {
            if (currentObject) {
                scene.remove(currentObject);
            }

            const geometry = createGeometry(type);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00d9ff,
                metalness: 0.5,
                roughness: 0.5,
                emissive: 0x00d9ff,
                emissiveIntensity: 0.1
            });

            currentObject = new THREE.Mesh(geometry, material);
            currentObject.castShadow = true;
            currentObject.receiveShadow = true;

            currentObject.userData = {
                originalGeometry: geometry.clone(),
                shearXY: 0,
                shearXZ: 0
            };

            scene.add(currentObject);
            currentObjectType = type;

            updateObjectInfo(type);
        }

        function updateObjectInfo(type) {
            const names = {
                cube: 'Cube',
                sphere: 'Sphere',
                torus: 'Torus',
                tetrahedron: 'Tetrahedron',
                octahedron: 'Octahedron',
                cone: 'Cone',
                cylinder: 'Cylinder',
                pyramid: 'Pyramid'
            };

            const vertexCounts = {
                cube: 24,
                sphere: 1026,
                torus: 3200,
                tetrahedron: 4,
                octahedron: 6,
                cone: 128,
                cylinder: 128,
                pyramid: 12
            };

            const faceCounts = {
                cube: 6,
                sphere: 512,
                torus: 5120,
                tetrahedron: 4,
                octahedron: 8,
                cone: 64,
                cylinder: 66,
                pyramid: 4
            };

            document.getElementById('objectName').textContent = names[type];
            document.getElementById('vertexCount').textContent = vertexCounts[type];
            document.getElementById('faceCount').textContent = faceCounts[type];
        }

        document.querySelectorAll('.object-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.object-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                createObject(btn.dataset.object);
                resetControls();
            });
        });

        function applyShear() {
            if (!currentObject) return;

            const original = currentObject.userData.originalGeometry;
            const geometry = original.clone();
            const positions = geometry.attributes.position.array;

            const shearXY = parseFloat(document.getElementById('shearXY').value);
            const shearXZ = parseFloat(document.getElementById('shearXZ').value);

            for (let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i + 1];
                const z = positions[i + 2];

                positions[i] += y * shearXY + z * shearXZ;
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.computeVertexNormals();

            currentObject.geometry.dispose();
            currentObject.geometry = geometry;
        }

        function updateTransformations() {
            if (!currentObject) return;

            const rotX = parseFloat(document.getElementById('rotX').value) * Math.PI / 180;
            const rotY = parseFloat(document.getElementById('rotY').value) * Math.PI / 180;
            const rotZ = parseFloat(document.getElementById('rotZ').value) * Math.PI / 180;

            currentObject.rotation.x = rotX;
            currentObject.rotation.y = rotY;
            currentObject.rotation.z = rotZ;

            const scale = parseFloat(document.getElementById('scaleUniform').value);
            currentObject.scale.set(scale, scale, scale);

            currentObject.position.x = parseFloat(document.getElementById('transX').value);
            currentObject.position.y = parseFloat(document.getElementById('transY').value);
            currentObject.position.z = parseFloat(document.getElementById('transZ').value);

            currentObject.material.metalness = parseFloat(document.getElementById('metalness').value);
            currentObject.material.roughness = parseFloat(document.getElementById('roughness').value);
        }

        const sliders = {
            'rotX': 'rotXValue',
            'rotY': 'rotYValue',
            'rotZ': 'rotZValue',
            'scaleUniform': 'scaleUniformValue',
            'transX': 'transXValue',
            'transY': 'transYValue',
            'transZ': 'transZValue',
            'shearXY': 'shearXYValue',
            'shearXZ': 'shearXZValue',
            'metalness': 'metalnessValue',
            'roughness': 'roughnessValue'
        };

        Object.keys(sliders).forEach(sliderId => {
            const slider = document.getElementById(sliderId);
            const display = document.getElementById(sliders[sliderId]);

            slider.addEventListener('input', () => {
                const value = parseFloat(slider.value);

                if (sliderId.includes('rot')) {
                    display.textContent = value.toFixed(0);
                } else if (sliderId === 'scaleUniform') {
                    display.textContent = value.toFixed(1);
                } else {
                    display.textContent = value.toFixed(1);
                }

                if (sliderId.includes('shear')) {
                    applyShear();
                }

                updateTransformations();
            });
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            resetControls();
            createObject('cube');
            document.querySelectorAll('.object-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-object="cube"]').classList.add('active');
        });

        function resetControls() {
            Object.keys(sliders).forEach(sliderId => {
                const slider = document.getElementById(sliderId);
                slider.value = 0;
            });

            document.getElementById('scaleUniform').value = 1;
            document.getElementById('metalness').value = 0.5;
            document.getElementById('roughness').value = 0.5;

            Object.keys(sliders).forEach(sliderId => {
                const display = document.getElementById(sliders[sliderId]);
                const slider = document.getElementById(sliderId);
                display.textContent = parseFloat(slider.value).toFixed(1);
            });

            updateTransformations();
        }

        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging && currentObject) {
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                currentObject.rotation.y += deltaX * 0.005;
                currentObject.rotation.x += deltaY * 0.005;

                document.getElementById('rotX').value = (currentObject.rotation.x * 180 / Math.PI).toFixed(0);
                document.getElementById('rotY').value = (currentObject.rotation.y * 180 / Math.PI).toFixed(0);

                document.getElementById('rotXValue').textContent = (currentObject.rotation.x * 180 / Math.PI).toFixed(0);
                document.getElementById('rotYValue').textContent = (currentObject.rotation.y * 180 / Math.PI).toFixed(0);

                previousMousePosition = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(1, Math.min(20, camera.position.z));
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        createObject('cube');
        animate();
    </script>
</body>
</html>
